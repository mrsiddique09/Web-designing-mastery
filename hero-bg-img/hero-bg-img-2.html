<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hero-bg-img-2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .hero {
        background-image: url(https://images.pexels.com/photos/220326/pexels-photo-220326.jpeg);
        width: 100%;
        height: 400px;
        background-position: center;
        background-size: cover;
        position: relative;
      
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 400px;
        background-color: rgba(0, 0, 0, 0.4);
      }
      .content {
        color: white;
        text-align: center;
        position: relative;
        top: 35%;
      }
      h2 {
        font-size: 40px;
        font-style: italic;
        font-family: "Georgia", serif;
        font-weight: bold;
        margin-bottom: 15px;
      }
      p {
        font-size: 18px;
        font-family: "Verdana", sans-serif;
        margin: 0 20px;
        font-weight: semi-bold;
        font-style: italic;
      }
   
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="overlay"></div>
      <div class="content">
        <h2>Welcome to our library</h2>
        <p>
          Explore a world of knowledge and adventure with our extensive
          collection of books and resources.
        </p>
      </div>
    </div>
    
  </body>
</html>
