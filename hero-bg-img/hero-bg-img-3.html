<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hero-bg-img-3</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      .hero {
        background-image: url(https://images.pexels.com/photos/3201920/pexels-photo-3201920.jpeg?auto=compress&cs=tinysrgb&h=650&w=940);
        height: 400px;
        background-size: cover;
        background-position: center;
        position: relative;
      }
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.5);
        width: 100%;
        height: 400px;
      }

      .content {
        color: #ffcc00d5;
        text-align: center;
        position: relative;
        top: 35%;
        font-style: italic;
        font-weight: bold;
      }
      h2 {
        font-size: 50px;
        font-family: "Georgia", serif;
        margin-bottom: 15px;
        margin: 0;
        margin-bottom: 15px;
      }
      .navbar-brand {
        font-weight: bold;
        font-size: 24px;
        padding-left: 20px;
        font-style: italic;
        color: #ffcc00d5;
      }
      .nav-link {
        font-size: 18px;
        margin-right: 15px;
        color: #ffcc00d5;
        font-style: italic;
        font-weight: bold;
      }
      .navbar {
        background-color: rgba(0, 0, 0, 0.5);
      }
      .img {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <!-- header -->
    <header>
      <div class="hero">
        <div class="overlay"></div>
        <div class="content">
          <h2>Welcome to our restaurant</h2>
          <p class="lead">
            Experience the finest dining with a blend of exquisite flavors and
            elegant ambiance.
          </p>
        </div>
      </div>
    </header>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="#"> Our Restaurant</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav d-flex justify-content-end w-100 px-4 fw-bold">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Service</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </body>
</html>
