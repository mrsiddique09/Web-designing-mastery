<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hero-bg-img-4</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      .hero {
        background-image: url(/img/Taj-Mahal-2.jpg);
        height: 400px;
        background-size: cover;
        background-position: center;
        position: relative;
      }
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.5);
        width: 100%;
        height: 400px;
      }

      .content {
        color: white;
        text-align: center;
        position: relative;
        top: 35%;
        /* font-style: italic; */
        font-weight: bold;

      }
      h2 {
        font-size: 50px;
        margin-bottom: 15px;
        margin: 0;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <!-- header -->
    <header>
      <div class="hero">
        <div class="overlay"></div>
        <div class="content">
          <h2 class="display-5">Travalling to tajmahal</h2>
          <p class="lead">
            Experience the magnificence of the Taj Mahal, a timeless symbol of
            love and architectural brilliance.
          </p>
        </div>
      </div>
    </header>
  </body>
</html>
