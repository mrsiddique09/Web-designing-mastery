<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container-1 {
        height: 500px;
        border: 2px solid red;
        background-color: bisque;
        border-radius: 6px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-direction: column;
        margin-bottom: 30px;
      }

      .box {
        border: 1px solid brown;
        background-color: rgb(160, 249, 160);
        width: 300px;
        height: 100px;
        text-align: center;
        padding: 20px;
        font-weight: bold;
        font-size: 32px;
      }
      .container-2 {
        height: 400px;
        border: 2px solid red;
        background-color: bisque;
        border-radius: 6px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-direction: row;
        margin-bottom: 30px;
      }

      .box-1 {
        border: 1px solid brown;
        background-color: rgb(160, 249, 160);
        width: 300px;
        height: 100px;
        text-align: center;
        padding: 20px;
        font-weight: bold;
        font-size: 32px;
      }
    </style>
  </head>
  <body>
    <h1>Flex-box-basics</h1>
    <div class="container-1">
      <div class="box">box-1</div>
      <div class="box">box-2</div>
      <div class="box">box-3</div>
    </div>

    <div class="container-2">
      <div class="box-1">box-1</div>
      <div class="box-1">box-2</div>
      <div class="box-1">box-3</div>
    </div>
  </body>
</html>
