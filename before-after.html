<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .mag-link {
        color: blue;
        font-size: 30px;
        text-decoration: none;
        position: relative;
        font-style: italic;
       
      }
      .mag-link::before {
        content: " 🚀";
      }
      .mag-link::after {
        content: "";
        position: absolute;
        bottom: -5px;
        left: 0;
        height: 3px;
        background-color: blue;
        width: 0;
        transition: all 0.6s ease;
      }
      .mag-link:hover::after {
        width: 60%;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center">
      <a href="#" class="mag-link">Hover over me!</a>
    </div>
  </body>
</html>
